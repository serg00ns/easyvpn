{% extends "base.html" %}

{% block content %}
<section class="card auth-card">
  <span class="pill">Login Required</span>
  <h2>Sign in to easyvpn</h2>
  <p class="lead">Use your account to continue.</p>

  {% if error_message %}
  <p class="auth-error" role="alert">{{ error_message }}</p>
  {% endif %}

  <form class="auth-form" method="post" action="/login">
    <input type="hidden" name="next_path" value="{{ next_path }}" />

    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required />

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />

    <button class="cta" type="submit">Log in</button>
  </form>

  <p class="auth-hint">Default credentials: admin / easyvpn</p>
</section>
{% endblock %}
