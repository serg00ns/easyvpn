<!doctype html>
<html lang="en" data-theme="{{ theme }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>easyvpn</title>
    <meta name="description" content="easyvpn server-rendered FastAPI app." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{% if is_authenticated %}/servers{% else %}/login{% endif %}">easyvpn</a>
      {% if is_authenticated %}
      <nav class="nav" aria-label="Main navigation">
        <a href="/servers" class="{% if active_path == '/servers' %}active{% endif %}">Servers</a>
        <a href="/clients" class="{% if active_path == '/clients' %}active{% endif %}">Clients</a>
      </nav>
      {% endif %}
      <div class="header-actions">
      <form method="post" action="/theme/toggle">
        <input type="hidden" name="next_path" value="{{ request.url.path }}" />
        <button class="theme-toggle" type="submit">
          {% if theme == "dark" %}Light Mode{% else %}Dark Mode{% endif %}
        </button>
      </form>
      {% if is_authenticated %}
      <form method="post" action="/logout">
        <button class="theme-toggle" type="submit">Logout</button>
      </form>
      {% endif %}
      </div>
    </header>

    <main class="view" aria-live="polite">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <p>easyvpn</p>
    </footer>
  </body>
</html>
